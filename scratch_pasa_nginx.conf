server {
    server_name pasa.izhaanintellect.fun;

    client_max_body_size 200M;

    # Security Headers with tailored Content-Security-Policy
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' wss: https: https://static.cloudflareinsights.com https://cloudflareinsights.com;" always;

    # Landing page (served by Docker container on port 8165)
    location / {
        proxy_pass http://127.0.0.1:8165;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Zero-Data Stateless Reverse Proxy for Telegram Bot API
    # Allows Android clients in jurisdictions where api.telegram.org is blocked
    # to reach Telegram directly. No logs, no caching, zero disk storage.
    location ~ ^/tg/(.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        proxy_pass https://api.telegram.org/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        
        # Privacy: Disable access logging completely for this endpoint
        access_log off;
        
        # Memory-only streaming without buffering
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Extended timeouts for Telegram long-polling (getUpdates)
        proxy_read_timeout 90s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 90s;
        
        # Pass headers cleanly
        proxy_set_header Host api.telegram.org;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
    }

    # Explicit 404 for removed dashboard/admin paths
    location ~ ^/(dashboard|admin|ws/dashboard) {
        return 404;
    }

    # PASA Control Plane & Licensing API
    location /api/ {
        proxy_pass http://127.0.0.1:8160/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Terms of Service & EULA
    location = /terms {
        proxy_pass http://127.0.0.1:8165/terms.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Privacy Policy & Sovereign Zero-Telemetry Guarantee
    location = /privacy {
        proxy_pass http://127.0.0.1:8165/privacy.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8160/health;
        proxy_set_header Host $host;
    }

    # Direct Releases Download Proxy
    location /releases/ {
        proxy_pass http://127.0.0.1:8160/releases/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pasa.izhaanintellect.fun/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pasa.izhaanintellect.fun/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pasa.izhaanintellect.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name pasa.izhaanintellect.fun;
    return 404; # managed by Certbot
}
