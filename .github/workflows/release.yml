name: 🚀 PASA Sentinel — Production Release Publisher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: 📦 Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          MANIFEST="releases/app_releases.json"
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST="pasa-server/data/app_releases.json"
          fi
          
          VERSION_NAME=$(jq -r '.[0].versionName' "$MANIFEST")
          VERSION_CODE=$(jq -r '.[0].versionCode' "$MANIFEST")
          APK_NAME=$(jq -r '.[0].fileName' "$MANIFEST")
          APK_SHA256=$(jq -r '.[0].sha256' "$MANIFEST")
          APK_SIZE=$(jq -r '.[0].size' "$MANIFEST")
          RELEASE_NOTES=$(jq -r '.[0].releaseNotes' "$MANIFEST")

          if [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v$VERSION_NAME"
          fi
          
          APK_FILE="releases/$APK_NAME"
          if [ ! -f "$APK_FILE" ]; then
            APK_FILE="releases/pasa-latest.apk"
          fi
          SETUP_KIT="releases/PASA-Device-Owner-Setup-Kit.zip"

          cat << EOF > release_notes.md
          ## 🛡️ PASA Sentinel $TAG (Build $VERSION_CODE) — Production Release

          Next-Generation Sovereign Mobile Defense & Covert Anti-Theft Agent for Android (8.0 – 16 / API 26 – 36).
          Zero Google Play dependencies. Air-gapped cellular SMS fallback. Knox-grade Device Owner permanence. Dual-channel Telegram C2. Direct-to-Telegram Zero-Storage Architecture.

          ### 🔐 Cryptographic Integrity & Checksums
          - **Production APK:** \`$APK_NAME\` (Symlink: \`pasa-latest.apk\`)
          - **Byte Size:** \`$APK_SIZE\` bytes
          - **APK SHA-256 Digest:** \`$APK_SHA256\`
          - **Windows Setup Kit:** \`PASA-Device-Owner-Setup-Kit.zip\`
          - **VirusTotal Consensus Audit:** [Inspect VirusTotal File](https://www.virustotal.com/gui/file/$APK_SHA256)

          ### 🚀 Release Highlights
          $RELEASE_NOTES

          ### 🌐 Official Deployment Endpoints
          - **Web Operations Console:** https://pasa.izhaanintellect.fun/
          - **Interactive Field Manual:** https://pasa.izhaanintellect.fun/manual.html
          - **OTA Manifest:** https://pasa.izhaanintellect.fun/api/app/latest?current_version_code=0
          EOF

          AUDIT_BUNDLE="releases/PASA-Security-Audit-SARIF-$TAG.zip"
          ASSETS=("$APK_FILE" "$SETUP_KIT")
          if [ -f "$AUDIT_BUNDLE" ]; then
            ASSETS+=("$AUDIT_BUNDLE")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes and assets..."
            gh release edit "$TAG" --title "PASA Sentinel $TAG (Build $VERSION_CODE)" --notes-file release_notes.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating new release for $TAG..."
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "PASA Sentinel $TAG (Build $VERSION_CODE)" \
              --notes-file release_notes.md
          fi

