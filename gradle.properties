# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dcom.android.tools.r8.threads=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Note: do not hardcode org.gradle.java.home here — it breaks the build on any
# machine with a different JDK path (CI, Linux, other contributors). Gradle uses
# JAVA_HOME / the toolchain instead. Set it locally in a non-committed
# gradle.properties (e.g. ~/.gradle/gradle.properties) if you must override.
android.suppressUnsupportedCompileSdk=36
org.gradle.vfs.watch=false
