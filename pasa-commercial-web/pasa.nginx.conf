server {
    server_name pasa.izhaanintellect.fun;

    client_max_body_size 200M;

    # Security Headers with tailored Content-Security-Policy
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' wss: https: https://static.cloudflareinsights.com https://cloudflareinsights.com;" always;

    # Landing page (served by Docker container on port 8165)
    location / {
        proxy_pass http://127.0.0.1:8165;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PASA Control Plane & Licensing API
    location /api/ {
        proxy_pass http://127.0.0.1:8160/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health & Admin shortcuts
    location /health {
        proxy_pass http://127.0.0.1:8160/health;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pasa.izhaanintellect.fun/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pasa.izhaanintellect.fun/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pasa.izhaanintellect.fun) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name pasa.izhaanintellect.fun;
    return 404; # managed by Certbot
}
